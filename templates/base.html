<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app_title">Uzhavan Desk - உழவன் மேலாளர்</title>
  
  <!-- Favicon & PWA -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#15803d">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-agri sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="/">
        <span class="brand-icon">🌱</span>
        <span data-i18n="app_title">Uzhavan Desk</span>
      </a>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <!-- Weather snippet pill -->
        <a href="/advisories" class="badge bg-white text-success text-decoration-none px-2 py-2 d-none d-sm-inline-flex align-items-center">
          <i class="bi bi-cloud-sun me-1"></i>
          <span>{{ settings.district or 'Thanjavur' }}</span>
        </a>

        <!-- Language toggle button -->
        <button id="langToggleBtn" class="lang-toggle-btn" onclick="toggleLanguage()">
          🇬🇧 English
        </button>

        <!-- Settings link -->
        <a href="/settings" class="btn btn-sm btn-outline-light rounded-circle" title="Settings">
          <i class="bi bi-gear-fill"></i>
        </a>
      </div>

      <!-- Desktop Nav links -->
      <div class="collapse navbar-collapse d-none d-lg-block ms-4" id="desktopNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="/" data-i18n="nav_dashboard">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/mandi" data-i18n="nav_mandi">Live Mandi Prices</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/crops" data-i18n="nav_crops">Crops & Planting</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/livestock" data-i18n="nav_livestock">Livestock & Breeding</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/financials" data-i18n="nav_financials">Farm Financials</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/advisories" data-i18n="nav_advisory">Weather & Schemes</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Mobile Bottom Sticky Navigation -->
  <div class="mobile-nav-bar">
    <a href="/" class="mobile-nav-item">
      <i class="bi bi-speedometer2"></i>
      <span data-i18n="nav_dashboard">Home</span>
    </a>
    <a href="/mandi" class="mobile-nav-item">
      <i class="bi bi-shop"></i>
      <span data-i18n="nav_mandi">Mandi</span>
    </a>
    <a href="/crops" class="mobile-nav-item">
      <i class="bi bi-flower1"></i>
      <span data-i18n="nav_crops">Crops</span>
    </a>
    <a href="/livestock" class="mobile-nav-item">
      <i class="bi bi-heart-pulse"></i>
      <span data-i18n="nav_livestock">Cattle</span>
    </a>
    <a href="/financials" class="mobile-nav-item">
      <i class="bi bi-cash-coin"></i>
      <span data-i18n="nav_financials">P&L</span>
    </a>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;"></div>

  <!-- Main Content Block -->
  <div class="container-fluid px-3 px-md-4 py-3">
    {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}

  <!-- Register PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/js/sw.js')
          .then(reg => console.log('PWA ServiceWorker registered'))
          .catch(err => console.log('ServiceWorker registration error:', err));
      });
    }
  </script>
</body>
</html>
