<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Uzhavan Desk</title>
  
  <!-- Institutional Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      background-color: var(--bg-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
    }
    .auth-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      max-width: 420px;
      width: 100%;
      overflow: hidden;
    }
    .auth-top {
      padding: 28px 24px 18px 24px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-top">
    <div class="brand-icon-box mx-auto mb-2">🌱</div>
    <h4 class="fw-bold mb-0 text-dark">Uzhavan Desk</h4>
    <div class="brand-subtitle mt-1">Tamil Nadu Agri & Livestock Intelligence</div>
  </div>

  <div class="p-4">
    {% if error %}
    <div class="alert alert-card danger py-2 small d-flex align-items-center mb-3">
      <i class="bi bi-exclamation-circle-fill text-danger me-2"></i>
      <div>{{ error }}</div>
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="mb-3">
        <label class="form-label small fw-bold text-muted">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between">
          <label class="form-label small fw-bold text-muted">Password</label>
        </div>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2 fw-bold mb-3 shadow-sm">
        Sign In to Farm Dashboard
      </button>
    </form>

    <!-- Quick Demo Login Button -->
    <form method="POST" action="/login" class="mb-3">
      <input type="hidden" name="action" value="demo">
      <button type="submit" class="btn btn-light border w-100 py-2 small fw-bold text-secondary">
        <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Instant Demo Login (Murugan - Thanjavur)
      </button>
    </form>

    <div class="text-center pt-2 border-top">
      <span class="text-secondary small">New to Uzhavan Desk?</span>
      <a href="/signup" class="text-success fw-bold ms-1 text-decoration-none">
        Register & Select Location &rarr;
      </a>
    </div>
  </div>
</div>

</body>
</html>
