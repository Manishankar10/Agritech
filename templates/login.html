<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Uzhavan Desk (உழவன் மேலாளர்)</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #f0fdf4 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(21, 128, 61, 0.12);
      border: 1px solid #dcfce7;
      max-width: 440px;
      width: 100%;
      overflow: hidden;
    }
    .auth-header {
      background: linear-gradient(135deg, #14532d, #15803d);
      color: #ffffff;
      padding: 30px 24px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-header">
    <div style="font-size: 3rem; line-height: 1;" class="mb-2">🌱</div>
    <h3 class="fw-bold mb-1">உழவன் மேலாளர்</h3>
    <div class="small text-light opacity-75">Uzhavan Desk - TN Agri & Livestock Manager</div>
  </div>

  <div class="p-4">
    {% if error %}
    <div class="alert alert-danger py-2 small d-flex align-items-center mb-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <div>{{ error }}</div>
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="mb-3">
        <label class="form-label small fw-bold text-muted">Username / பயனர் பெயர்</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-bold text-muted">Password / கடவுச்சொல்</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2 fw-bold mb-3 shadow-sm">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In / உள்நுழைக
      </button>
    </form>

    <!-- Quick Demo Login Button -->
    <form method="POST" action="/login" class="mb-3">
      <input type="hidden" name="action" value="demo">
      <button type="submit" class="btn btn-outline-success w-100 py-2 small fw-bold">
        <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Instant Demo Login (Murugan - Thanjavur)
      </button>
    </form>

    <hr class="my-3">

    <div class="text-center">
      <span class="text-muted small">New Farmer? புதிய உழவரா?</span><br>
      <a href="/signup" class="btn btn-link text-success fw-bold text-decoration-none">
        <i class="bi bi-person-plus-fill me-1"></i> Create Account & Set Your Location &rarr;
      </a>
    </div>
  </div>
</div>

</body>
</html>
