<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Uzhavan Desk</title>
  
  <!-- Favicon & PWA -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="shortcut icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#10b981">
  
  <!-- Institutional Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      background-color: var(--bg-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 14px;
    }
    .auth-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      max-width: 520px;
      width: 100%;
      overflow: hidden;
    }
    .auth-top {
      padding: 24px 24px 16px 24px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }
<script>
  document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
</script>
</head>
<body>

<div class="auth-card">
  <div class="auth-top">
    <div class="brand-icon-box mx-auto mb-2">🌱</div>
    <h4 class="fw-bold mb-0">Register Farmer Profile</h4>
    <div class="brand-subtitle mt-1">Setup Your Account & Location Preferences</div>
  </div>

  <div class="p-4">
    {% if error %}
    <div class="alert alert-card danger py-2 small d-flex align-items-center mb-3">
      <i class="bi bi-exclamation-circle-fill text-danger me-2"></i>
      <div>{{ error }}</div>
    </div>
    {% endif %}

    <div class="alert alert-card info small mb-3">
      <i class="bi bi-geo-alt-fill text-primary me-1"></i>
      <strong>Location Personalization:</strong> Live Mandi wholesale rates, rainfall forecasts, and agricultural advisories will automatically focus on your selected district and regional APMC markets.
    </div>

    <form method="POST" action="/signup">
      <!-- Credentials -->
      <div class="kpi-label text-muted mb-2">Account Credentials</div>
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label class="form-label small fw-bold text-muted">Username *</label>
          <input type="text" name="username" class="form-control" placeholder="e.g. karthik_farm" required autofocus>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-bold text-muted">Password *</label>
          <input type="password" name="password" class="form-control" placeholder="Min 4 characters" required>
        </div>
      </div>

      <!-- Farmer details -->
      <div class="kpi-label text-muted mb-2">Farmer & Farm Information</div>
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label class="form-label small fw-bold text-muted">Farmer Full Name *</label>
          <input type="text" name="farmer_name" class="form-control" placeholder="e.g. Karthikeyan R" required>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-bold text-muted">Farm / Estate Name</label>
          <input type="text" name="farm_name" class="form-control" placeholder="e.g. Vasantham Agri Farm">
        </div>
      </div>

      <!-- Location Preferences -->
      <div class="kpi-label text-muted mb-2">Location Preferences</div>
      <div class="mb-3">
        <label class="form-label small fw-bold text-dark">
          <i class="bi bi-pin-map-fill text-danger me-1"></i> Home District (Tamil Nadu) *
        </label>
        <select name="district" class="form-select fw-bold border-success" required>
          <option value="">-- Choose Your District (38 Districts) --</option>
          {% for d in districts %}
          <option value="{{ d }}">{{ d }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label class="form-label small fw-bold text-muted">Taluk / வட்டாரம்</label>
          <input type="text" name="taluk" class="form-control" placeholder="e.g. Pollachi / Kumbakonam">
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-bold text-muted">Village / கிராமம்</label>
          <input type="text" name="village" class="form-control" placeholder="e.g. Anamalai / Melatur">
        </div>
      </div>

      <!-- Language Preference (Default English) -->
      <div class="mb-4">
        <label class="form-label small fw-bold text-muted">Default Language</label>
        <div class="d-flex gap-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="language" id="langEn" value="en" checked>
            <label class="form-check-label fw-bold" for="langEn">English (Default)</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="language" id="langTa" value="ta">
            <label class="form-check-label fw-bold" for="langTa">தமிழ் (Tamil)</label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm mb-3">
        Complete Registration & Launch
      </button>
    </form>

    <div class="text-center pt-2 border-top">
      <span class="text-secondary small">Already registered?</span>
      <a href="/login" class="text-success fw-bold ms-1 text-decoration-none">Sign In &rarr;</a>
    </div>
  </div>
</div>

</body>
</html>
