<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="farmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldSoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#farmGrad)" filter="url(#shadow)"/>
  <rect x="7" y="7" width="114" height="114" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Golden soil bed accent -->
  <path d="M 46 98 Q 64 94 82 98" fill="none" stroke="url(#goldSoil)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Main Sprout Stem -->
  <path d="M 64 96 Q 64 78 64 68 Q 64 54 68 42" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Left Leaf -->
  <path d="M 64 72 C 45 68 33 54 34 46 C 44 45 56 56 64 65 Z" fill="#e6fcf5" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Left Leaf Vein -->
  <path d="M 63 67 Q 48 58 37 49" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right Leaf -->
  <path d="M 66 56 C 85 45 96 32 94 25 C 83 26 73 38 67 49 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right Leaf Vein -->
  <path d="M 68 51 Q 81 40 91 29" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
</svg>
